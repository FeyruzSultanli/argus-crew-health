# Build ARGUS and publish it on GitHub Pages at https://feyruzsultanli.github.io/argus-crew-health/
# Pages must be set to "GitHub Actions" as the build source (Settings → Pages, or the REST API).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a queued (not a running) deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, unit tests
        run: npm run check

      - name: Build for the /argus-crew-health/ sub-path
        run: npm run build
        env:
          ARGUS_BASE: /argus-crew-health/

      - name: SPA fallback for deep links (Pages serves 404.html for unknown paths)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # keeps dist/.nojekyll (harmless with an Actions deployment, required if the branch source is ever used)
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
